name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip newest project
        run: |
          Z=$(ls harfchin3_v*.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -q -o "$Z" -d src_build
          D=$(dirname "$(find src_build -maxdepth 3 -name gradlew | head -1)")
          V=$(grep -oP 'versionName = "\K[^"]+' "$D/app/build.gradle.kts")
          echo "PROJ=$D" >> "$GITHUB_ENV"
          echo "VER=$V" >> "$GITHUB_ENV"
          echo "### Building HarfChin $V from $Z" >> "$GITHUB_STEP_SUMMARY"
          chmod +x "$D/gradlew" "$D/gradlew.real"

      - name: Build APK
        run: |
          cd "$PROJ" && ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/HarfChin-v${VER}.apk"

      - name: Unit tests
        continue-on-error: true
        run: cd "$PROJ" && ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HarfChin-v${{ env.VER }}
          path: ${{ env.PROJ }}/app/bu
